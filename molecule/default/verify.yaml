---
- name: verify persistent tuned configuration and profile transitions
  hosts: all
  vars_files:
    - ../../defaults/main.yaml
  tasks:
    - name: collect installed packages
      ansible.builtin.package_facts:

    - name: verify tuned packages are installed
      ansible.builtin.assert:
        that:
          - "'tuned' in ansible_facts.packages"
          - "'tuned-profiles-atomic' in ansible_facts.packages"

    - name: inspect configuration metadata
      ansible.builtin.stat:
        path: "{{ item }}"
      register: tuned_test_metadata

      loop:
        - /etc/tuned/tuned-main.conf
        - /etc/tuned/active_profile
        - /etc/tuned/profile_mode
    - name: verify root owns the persistent configuration
      ansible.builtin.assert:
        that:
          - item.stat.exists
          - item.stat.isreg
          - item.stat.uid == 0
          - item.stat.gid == 0
          - item.stat.mode == '0644'
      loop: "{{ tuned_test_metadata.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: inspect service boot enablement
      ansible.builtin.command:
        argv: [systemctl, is-enabled, tuned.service]
      register: tuned_test_enabled
      changed_when: false

    - name: verify tuned is enabled for the next boot
      ansible.builtin.assert:
        that: tuned_test_enabled.stdout == 'enabled'

    - name: read daemon configuration
      ansible.builtin.slurp:
        src: /etc/tuned/tuned-main.conf
      register: tuned_test_configuration

    - name: verify configured daemon settings
      ansible.builtin.assert:
        that: item in (tuned_test_configuration.content | b64decode).splitlines()
      loop:
        - "daemon = {{ tuned_daemon | ternary('1', '0') }}"
        - "dynamic_tuning = {{ tuned_dynamic_tuning | ternary('1', '0') }}"
        - "sleep_interval = {{ tuned_sleep_interval }}"
        - "update_interval = {{ tuned_update_interval }}"
        - "recommend_command = {{ tuned_enable_recommend | ternary('1', '0') }}"
        - "reapply_sysctl = {{ tuned_reapply_sysctl | ternary('1', '0') }}"

    - name: read initial profile selection
      ansible.builtin.slurp:
        src: /etc/tuned/active_profile
      register: tuned_test_initial_profile

    - name: read profile selection mode
      ansible.builtin.slurp:
        src: /etc/tuned/profile_mode
      register: tuned_test_profile_mode

    - name: read the recommended profile without activating it
      ansible.builtin.command:
        argv: [tuned-adm, recommend]
      register: tuned_test_recommended
      changed_when: false

    - name: verify recommended profile was selected persistently
      ansible.builtin.assert:
        that:
          - (tuned_test_initial_profile.content | b64decode | trim) == (tuned_test_recommended.stdout | trim)
          - (tuned_test_profile_mode.content | b64decode) == 'manual\n'

    - name: select a profile supplied as a string
      ansible.builtin.include_role:
        name: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') | basename }}"
      vars:
        tuned_profile: balanced

    - name: read selected string profile
      ansible.builtin.slurp:
        src: /etc/tuned/active_profile
      register: tuned_test_string_profile

    - name: verify string profile selection
      ansible.builtin.assert:
        that: (tuned_test_string_profile.content | b64decode) == 'balanced\n'

    - name: select stacked profiles with a duplicate
      ansible.builtin.include_role:
        name: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') | basename }}"
      vars:
        tuned_profile: [balanced, powersave, balanced]

    - name: read stacked profile selection
      ansible.builtin.slurp:
        src: /etc/tuned/active_profile
      register: tuned_test_stacked_profiles

    - name: verify profile order and duplicate removal
      ansible.builtin.assert:
        that: (tuned_test_stacked_profiles.content | b64decode) == 'balanced powersave\n'

    - name: exercise invalid profile inputs
      ansible.builtin.include_tasks: tasks/invalid-profile.yaml
      loop: ["", [], false, { profile: balanced }, [balanced, null]]
      loop_control:
        loop_var: tuned_test_invalid_profile

    - name: restore the initially selected profile
      ansible.builtin.include_role:
        name: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') | basename }}"
      vars:
        tuned_profile: "{{ tuned_test_initial_profile.content | b64decode | trim }}"

    - name: read restored profile selection
      ansible.builtin.slurp:
        src: /etc/tuned/active_profile
      register: tuned_test_restored_profile

    - name: verify profile transitions preserve the initial state
      ansible.builtin.assert:
        that: tuned_test_restored_profile.content == tuned_test_initial_profile.content

    - name: flush service notifications
      ansible.builtin.meta: flush_handlers

    - name: verify profile changes did not start tuned
      ansible.builtin.command:
        argv: [pgrep, -x, tuned]
      register: tuned_test_process
      changed_when: false
      failed_when: tuned_test_process.rc != 1
