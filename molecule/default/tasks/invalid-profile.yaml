---
- name: initialize invalid profile result
  ansible.builtin.set_fact:
    tuned_test_rejected_profile: false

- name: apply invalid profile input
  vars:
    tuned_profile: "{{ tuned_test_invalid_profile }}"
  block:
    - name: invoke role validation
      ansible.builtin.include_role:
        name: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') | basename }}"
  rescue:
    # Loop assertions aggregate item failures instead of preserving fail_msg.
    - name: verify failure came from profile validation
      ansible.builtin.assert:
        that:
          - ansible_failed_task.action == 'ansible.builtin.assert'
          - ansible_failed_task.name in ['validate tuned profile type', 'validate tuned profile is not empty', 'validate tuned profile list entries']

    - name: record rejected profile input
      ansible.builtin.set_fact:
        tuned_test_rejected_profile: true

- name: verify invalid profile input was rejected
  ansible.builtin.assert:
    that: tuned_test_rejected_profile
