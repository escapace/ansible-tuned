---
- name: validate tuned profile type
  ansible.builtin.assert:
    that:
      - tuned_profile is string or (tuned_profile is sequence and tuned_profile is not mapping)
    fail_msg: tuned_profile must be a string or list of strings

- name: validate tuned profile is not empty
  ansible.builtin.assert:
    that:
      - tuned_profile | length > 0
    fail_msg: tuned_profile must not be empty

- name: validate tuned profile list entries
  ansible.builtin.assert:
    that:
      - item is string
      - item | length > 0
    fail_msg: tuned_profile list entries must be non-empty strings
  loop: "{{ [] if tuned_profile is string else tuned_profile }}"

- name: normalize requested tuned profiles
  ansible.builtin.set_fact:
    tuned_requested_profiles: "{{ [tuned_profile] if tuned_profile is string else tuned_profile }}"

- name: install tuned
  ansible.builtin.package:
    name: tuned
    state: present
  notify:
    - tuned restart tuned

- name: install atomic profile
  ansible.builtin.package:
    name: tuned-profiles-atomic
    state: present
  notify:
    - tuned restart tuned

- name: enable tuned
  ansible.builtin.systemd_service:
    name: tuned.service
    enabled: true

- name: configure tuned
  ansible.builtin.template:
    src: tuned-main.conf.j2
    dest: /etc/tuned/tuned-main.conf
    owner: root
    group: root
    mode: "0644"
  notify:
    - tuned restart tuned

- name: get the recommended tuned profile
  ansible.builtin.command:
    argv:
      - tuned-adm
      - recommend
  register: tuned_recommend
  changed_when: false

  when: "'recommended' in tuned_requested_profiles"
- name: validate the recommended tuned profile
  ansible.builtin.assert:
    that:
      - tuned_recommend.stdout | trim | length > 0
    fail_msg: tuned-adm did not return a recommended profile
  when: "'recommended' in tuned_requested_profiles"

- name: resolve requested tuned profiles
  ansible.builtin.set_fact:
    tuned_profile_names: >-
      {{ tuned_requested_profiles
         | map('regex_replace', '^recommended$', tuned_recommend.stdout | default('recommended') | trim)
         | unique
         | list }}

- name: validate requested tuned profiles exist
  ansible.builtin.command:
    argv:
      - tuned-adm
      - profile_info
      - "{{ item }}"
  changed_when: false

  loop: "{{ tuned_profile_names }}"
- name: select tuned profiles for the next service start
  ansible.builtin.copy:
    content: "{{ tuned_profile_names | join(' ') }}\n"
    dest: /etc/tuned/active_profile
    owner: root
    group: root
    mode: "0644"
  notify:
    - tuned restart tuned

- name: configure manual tuned profile selection
  ansible.builtin.copy:
    content: "manual\n"
    dest: /etc/tuned/profile_mode
    owner: root
    group: root
    mode: "0644"
  notify:
    - tuned restart tuned
