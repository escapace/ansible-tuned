---
- name: tuned gather service facts before restart
  ansible.builtin.service_facts:
  listen: tuned restart tuned

- name: tuned restart active tuned
  ansible.builtin.systemd_service:
    name: tuned.service
    state: restarted
  when:
    - not ansible_check_mode
    - >-
      (ansible_facts.services | default({}))
      .get("tuned.service", {})
      .get("state") == "running"
  listen: tuned restart tuned
